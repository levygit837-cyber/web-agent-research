name: protect-main

# Alternative to native branch protection (a private repo on the free plan
# has no access to branch protection or rulesets; the API returns 403).
# This workflow does NOT block the push (impossible without the paid plan):
# it detects a direct push to main and fails with revert instructions.
# Real client-side block: .githooks/pre-push.
# See docs/adr/0005-main-via-pr-no-paid-plan.md.

on:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read

jobs:
  no-direct-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject commits without an associated PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail

          if [ "$FORCED" = "true" ]; then
            echo "::error::force-push to main: rewriting public history invalidates the per-PR audit"
            exit 1
          fi

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$SHA"
          else
            range="$BEFORE..$SHA"
          fi
          mapfile -t commits < <(git rev-list "$range")

          if [ "${#commits[@]}" -eq 0 ]; then
            echo "no new commits on main; nothing to check."
            exit 0
          fi

          fail=0
          for c in "${commits[@]}"; do
            # No exemptions: even the root commit needs an associated PR.
            # Recreating main via push fails closed (the historical
            # bootstrap predates the gate).
            msg="$(git log -1 --format=%s "$c")"
            # PR landing via merge commit: "Merge pull request #N from ..."
            # Compares the SHA with the PR's real mergeCommit: forging the
            # message in a direct push does not pass.
            if [[ "$msg" =~ ^Merge\ pull\ request\ #([0-9]+)\  ]]; then
              n="${BASH_REMATCH[1]}"
              IFS=' ' read -r state oid <<< \
                "$(gh pr view "$n" --json state,mergeCommit --jq '.state + " " + .mergeCommit.oid')"
              if [ "$state" = "MERGED" ] && [ "$oid" = "$c" ]; then
                echo "ok $c is the merge of PR #$n"
                continue
              fi
              echo "::error::$c claims to merge PR #$n, but it does not match (state=$state, merge=$oid)"
              fail=1
              continue
            fi
            # Landing via squash/rebase or a commit from the PR branch: the
            # commits API associates the SHA with the PR even after merge.
            assoc="$(gh api "repos/$GITHUB_REPOSITORY/commits/$c/pulls" \
              --jq '[.[] | select(.merged_at != null)] | length')"
            if [ "$assoc" -ge 1 ]; then
              echo "ok $c is associated with a merged PR"
            else
              echo "::error::$c ($msg) has no associated PR: direct push to main"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            cat <<'EOF'
          Direct push to main detected. Every change enters through a PR (ADR-0005).
          To regularize:
            1. git revert <sha> on a new branch;
            2. open the revert PR and merge it there.
          Do not force-push to "undo": rewriting main also trips this gate
          (force-push is rejected above). An emergency never needs a direct
          push: a PR merge works even with red CI; if main broke, fix it
          with a revert PR.
          EOF
            exit 1
          fi
          echo "all new commits arrived via PR."
