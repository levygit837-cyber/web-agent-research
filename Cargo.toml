[package]
name = "web-agent-research"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "CLI Web Search agent for coding-agent Harnesses: searches free HTML engines, fetches pages, returns only the Synthesis"
license = "MIT"

[[bin]]
name = "web-agent-research"
path = "src/main.rs"

[lib]
name = "web_agent_research"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "zstd", "deflate"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1"
regex = "1"
scraper = "0.20"
url = "2"
htmd = "=0.5.5"
rand = "=0.9.5"
httpdate = "=1.0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "test-util"] }
flate2 = "=1.1.10"
brotli = "=9.0.0"
parking_lot = "=0.12.5"
